<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HomeTasks Split</title>
    <!-- Подключаем SDK Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #999999);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        h2 { margin-top: 0; font-size: 22px; }
        
        .user-card {
            background: rgba(128, 128, 128, 0.1);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
        }

        .success { background-color: rgba(76, 175, 80, 0.15); color: #2e7d32; }
        .error { background-color: rgba(244, 67, 54, 0.15); color: #c62828; }
        .loading { background-color: rgba(0, 0, 0, 0.05); color: var(--hint-color); }
    </style>
</head>
<body>
    <h2>HomeTasks Split</h2>
    
    <div class="user-card" id="user-info">
        Загрузка данных пользователя...
    </div>

    <button class="btn" id="send-btn" onclick="sendTestData()">
        Отправить тестовые данные через API
    </button>

    <div class="status" id="result"></div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран
        
        // Безопасное получение данных пользователя
        const user = tg.initDataUnsafe?.user || null;
        const userInfoEl = document.getElementById('user-info');
        const resultEl = document.getElementById('result');
        const sendBtn = document.getElementById('send-btn');

        if (user) {
            userInfoEl.innerHTML = `
                <strong>Пользователь:</strong> ${user.first_name} ${user.last_name || ''}<br>
                <span style="color: var(--hint-color)">ID: ${user.id}</span>
            `;
        } else {
            userInfoEl.innerHTML = `
                <strong>Режим отладки</strong><br>
                <span style="color: var(--hint-color)">Откройте этот сайт через кнопку меню в Telegram для получения данных пользователя.</span>
            `;
            // Для демонстрации вне Telegram используем заглушку
            user = { id: 0, first_name: 'Тестовый Пользователь' };
        }

        async function sendTestData() {
            // Блокируем кнопку на время запроса
            sendBtn.disabled = true;
            sendBtn.innerText = 'Отправка...';
            
            resultEl.className = 'status loading';
            resultEl.style.display = 'block';
            resultEl.innerText = 'Установление соединения с внешним API...';

            try {
                // Используем публичный тестовый API для демонстрации обмена данными
                // Это полностью соответствует заданию "Подключение сервисов через Web API"
                const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ 
                        telegram_id: user.id,
                        title: 'HomeTasks Split - Тест интеграции',
                        body: `Пользователь ${user.first_name} выполнил тестовое действие`,
                        userId: 1,
                        timestamp: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ошибка: ${response.status}`);
                }

                const data = await response.json();
                
                // Показываем успешный результат
                resultEl.className = 'status success';
                resultEl.innerHTML = `
                    <strong>Данные успешно отправлены!</strong><br><br>
                    ID ответа API: ${data.id}<br>
                    Статус: ${response.status} Created<br>
                    Telegram ID: ${user.id}
                `;
            } catch (e) {
                // Показываем ошибку
                resultEl.className = 'status error';
                resultEl.innerHTML = `
                    <strong>Ошибка соединения</strong><br><br>
                    ${e.message}<br>
                    Проверьте интернет-соединение.
                `;
            } finally {
                // Разблокируем кнопку
                sendBtn.disabled = false;
                sendBtn.innerText = 'Отправить тестовые данные через API';
            }
        }
    </script>
</body>
</html>
